name: Bug report
description: forgetproof reported something wrong, crashed, or damaged a store
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't paste real personal data or store files.** Redacted output is fine.
        If this is a security issue (a leak, lost data, a forged receipt), use the Security tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a script that builds a store from synthetic data.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: forgetproof 0.1.0, chromadb 1.5.9, Python 3.12, macOS 15
    validations:
      required: true
